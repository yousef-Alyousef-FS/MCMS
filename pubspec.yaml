name: medical_center
description: "A MEDICAL CENTER MANAGEMENT SYSTEM APP"
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  # ─────────────────────────────────────────────────────────────
  # Flutter SDK & Core
  # ─────────────────────────────────────────────────────────────
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ─────────────────────────────────────────────────────────────
  # Dependency Injection
  # ─────────────────────────────────────────────────────────────
  get_it: ^9.3.0

  # ─────────────────────────────────────────────────────────────
  # State Management & Functional Core
  # ─────────────────────────────────────────────────────────────
  dartz: ^0.10.1
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1

  # ─────────────────────────────────────────────────────────────
  # Routing & Navigation
  # ─────────────────────────────────────────────────────────────
  go_router: ^18.1.2

  # ─────────────────────────────────────────────────────────────
  # Networking
  # ─────────────────────────────────────────────────────────────
  dio: ^5.11.1
  internet_connection_checker_plus: ^3.1.2
  pretty_dio_logger: ^1.4.0

  # ─────────────────────────────────────────────────────────────
  # Localization
  # ─────────────────────────────────────────────────────────────
  easy_localization: ^3.0.8
  intl: ^0.20.3

  # ─────────────────────────────────────────────────────────────
  # Local Storage
  # ─────────────────────────────────────────────────────────────
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  # ─────────────────────────────────────────────────────────────
  # UI / Design & Responsiveness
  # ─────────────────────────────────────────────────────────────
  flutter_screen_responsive: ^1.0.0
  lottie: ^3.8.2

  # ─────────────────────────────────────────────────────────────
  # Logging
  # ─────────────────────────────────────────────────────────────
  pretty_logger: ^1.0.0

  # ─────────────────────────────────────────────────────────────
  # App Branding (Icons & Splash)
  # ─────────────────────────────────────────────────────────────
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

dev_dependencies:
  # ─────────────────────────────────────────────────────────────
  # Lints & Analysis
  # ─────────────────────────────────────────────────────────────
  flutter_lints: ^6.0.0
  very_good_analysis: ^11.0.0

  # ─────────────────────────────────────────────────────────────
  # Testing
  # ─────────────────────────────────────────────────────────────
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # ─────────────────────────────────────────────────────────────
  # Assets
  # ─────────────────────────────────────────────────────────────
  assets:
    - assets/images/
    - assets/i18n/
    - assets/svgs/
    - assets/animations/
    - assets/fonts/

# ───────────────────────────────────────────────────────────────
# Splash Screen
# ───────────────────────────────────────────────────────────────
flutter_native_splash:
  color: "#ffffff"
  color_dark: "#333333"
  # image: assets/images/splash.png
  android: true
  ios: true
  windows: true
  web: false

# ───────────────────────────────────────────────────────────────
# App Launcher Icons
# ───────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: "mipmap/ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.jpg"
  min_sdk_android: 21 
  web:
    generate: true
    image_path: "assets/images/app_icon.jpg"
    background_color: "#ffffff"
    theme_color: "#0DC078"
  windows:
    generate: true
    image_path: "assets/images/app_icon.jpg"
    icon_size: 48 
  macos:
    generate: true
    image_path: "assets/images/app_icon.jpg"